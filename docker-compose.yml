services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=polartwin-production-secret-key-antarctica-2026-demo
      - SIMULATION_TICK_SECONDS=4
      - FRONTEND_ORIGIN=http://localhost:5173,http://localhost:80

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
