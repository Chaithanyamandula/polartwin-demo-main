services:
  - type: web
    name: polartwin-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATION_TICK_SECONDS
        value: 4
      - key: FRONTEND_ORIGIN
        sync: false
